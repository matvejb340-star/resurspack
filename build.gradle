plugins {
	id 'fabric-loom' version '1.9.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Добавлено для скачивания библиотек вроде JLayer
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is optional, but most mods use it.
	// modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Библиотека для воспроизведения музыки (исправляет ошибку package javazoom.jl.decoder does not exist)
	implementation 'javazoom:jlayer:1.0.1'
	include 'javazoom:jlayer:1.0.1'
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sources jars to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.archives_base_name}"}
	}
}
